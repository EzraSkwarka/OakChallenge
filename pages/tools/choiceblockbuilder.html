<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <base href="/OakChallenge/" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Choice Block Builder</title>

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/chrome.css">
    <link rel="stylesheet" href="assets/css/tracker.css">
    <link rel="stylesheet" href="assets/css/sticky-header.css">
    <link rel="stylesheet" href="assets/css/choice-builder.css">

    <script src="assets/js/choice-builder.js" defer></script>
    <script src="assets/js/site-theme.js" defer></script>
    <script src="assets/js/site-chrome.js" defer></script>

<body>

    <div id="site-header-host">
    </div>

    <div class="page-band">
        <div class="container">

            <h1>Choice Block Builder</h1>

            <div class="builder-card">

                <label for="choiceKey">
                    Choice Key
                </label>

                <input id="choiceKey" type="text" value="starter">

            </div>

            <div id="branches"></div>

            <div class="footer-actions">

                <button id="addBranch">
                    Add Branch
                </button>

                <button id="generate">
                    Generate
                </button>

                <button id="copyOutput">
                    Copy Output
                </button>

            </div>

            <div class="builder-card">

                <h2>Output</h2>

                <textarea id="output" spellcheck="false"></textarea>

            </div>

        </div>
    </div>

    <div id="site-footer-host"></div>

</body>

</html>
