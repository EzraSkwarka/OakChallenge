<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <base href="/OakChallenge/" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>National Pokédex — Oak Tracker</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/chrome.css" />
    <link rel="stylesheet" href="assets/css/tracker.css" />
    <link rel="stylesheet" href="assets/css/sticky-header.css" />
    <link rel="stylesheet" href="assets/css/icons.css" />
    <link rel="stylesheet" href="assets/css/nat-dex-profiles.css" />

    <!-- Global JS -->
    <script src="assets/js/site-chrome.js" defer></script>
    <script src="assets/js/site-theme.js" defer></script>
</head>

<body>
    <div id="site-header-host"></div>

    <div class="page-band">

        <div class="container">
            <h1 id="game-title"></h1>
            <div id="choice-status" class="choice-status"></div>
        </div>

        <div class="table-wrap">

            <table id="pokemon-table" aria-label="National Pokédex completion">

                <thead>
                    <tr>
                        <th>Pokémon</th>
                        <th>Method</th>
                        <th class="center">
                            Action / Caught
                        </th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

        <div class="footer-actions">

            <button id="reset-all" type="button" class="reset-btn">
                Reset all progress
            </button>

        </div>

    </div>

    <div id="site-footer-host"></div>

    <!-- Page-specific JS -->
    <script src="data/nationaldex/progression.js" defer></script>
    <script src="assets/js/nat-dex-profiles.js" defer></script>
    <script src="assets/js/oak-tracker.js" defer></script>
    <script src="assets/js/tracker-extensions.js" defer></script>

</body>

</html>
